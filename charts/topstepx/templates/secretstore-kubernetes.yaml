apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.config.secretStoreName }}
  labels:
    {{- include "topstepx.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.secrets.store.remoteNamespace | quote }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        token:
          bearerToken:
            name: {{ .Values.secrets.store.tokenSecretName }}
            key: {{ .Values.secrets.store.tokenSecretKey }}
