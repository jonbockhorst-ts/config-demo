apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "topstepx.name" . }}
  labels:
    {{- include "topstepx.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "topstepx.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "topstepx.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/appsettings-global: {{ include (print $.Template.BasePath "/configmap-appsettings-global.yaml") . | sha256sum }}
        checksum/appsettings-secrets-template: {{ include (print $.Template.BasePath "/externalsecret-appsettings-secrets.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ include "topstepx.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ASPNETCORE_URLS
              value: http://0.0.0.0:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          volumeMounts:
            - name: appsettings-global
              mountPath: /app/appsettings.global.json
              subPath: appsettings.global.json
              readOnly: true
            - name: appsettings-secrets
              mountPath: /app/secrets
              readOnly: true
      volumes:
        - name: appsettings-global
          configMap:
            name: appsettings-global
        - name: appsettings-secrets
          secret:
            secretName: appsettings-secrets
