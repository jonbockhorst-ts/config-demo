apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: appsettings-secrets
  labels:
    {{- include "topstepx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.config.secretStoreName }}
    kind: SecretStore
  target:
    name: appsettings-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        appsettings.secrets.json: |-
          {
            "ConnectionStrings": {
              "TopStep": "Host={{ `{{ .pgHost }}` }};Port={{ `{{ .pgPort }}` }};Database={{ required "appsettings.connectionStrings.topStep.database is required" .Values.appsettings.connectionStrings.topStep.database }};Username={{ `{{ .pgUsername }}` }};Password={{ `{{ .pgPassword }}` }};Maximum Pool Size={{ default 200 .Values.appsettings.connectionStrings.topStep.maxPoolSize }};Command Timeout={{ default 120 .Values.appsettings.connectionStrings.topStep.commandTimeout }};Application Name={{ default .Values.appsettings.demo.environmentName .Values.appsettings.connectionStrings.topStep.applicationName }}"
              {{- with .Values.secrets.questdb }},
              "Chart": "Host={{ `{{ .qdbHost }}` }};Port={{ `{{ .qdbPort }}` }};Database={{ required "appsettings.connectionStrings.chart.database is required when secrets.questdb is set" $.Values.appsettings.connectionStrings.chart.database }};Username={{ `{{ .qdbUsername }}` }};Password={{ `{{ .qdbPassword }}` }};Command Timeout={{ default 30 $.Values.appsettings.connectionStrings.chart.commandTimeout }};Application Name={{ default $.Values.appsettings.demo.environmentName $.Values.appsettings.connectionStrings.chart.applicationName }}"
              {{- end }}
            },
            "Jwt": {
              "Secret": "{{ `{{ .jwtSecret }}` }}"
            }
          }
  data:
    - secretKey: pgHost
      remoteRef:
        key: {{ required "secrets.postgres.remoteKey is required" .Values.secrets.postgres.remoteKey | quote }}
        property: host
    - secretKey: pgPort
      remoteRef:
        key: {{ required "secrets.postgres.remoteKey is required" .Values.secrets.postgres.remoteKey | quote }}
        property: port
    - secretKey: pgUsername
      remoteRef:
        key: {{ required "secrets.postgres.remoteKey is required" .Values.secrets.postgres.remoteKey | quote }}
        property: username
    - secretKey: pgPassword
      remoteRef:
        key: {{ required "secrets.postgres.remoteKey is required" .Values.secrets.postgres.remoteKey | quote }}
        property: password
    - secretKey: jwtSecret
      remoteRef:
        key: {{ required "secrets.jwt.remoteKey is required" .Values.secrets.jwt.remoteKey | quote }}
        property: secret
    {{- with .Values.secrets.questdb }}
    - secretKey: qdbHost
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: host
    - secretKey: qdbPort
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: port
    - secretKey: qdbUsername
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: username
    - secretKey: qdbPassword
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: password
    {{- end }}
