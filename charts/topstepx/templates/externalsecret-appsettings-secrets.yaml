apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: appsettings-secrets
  labels:
    {{- include "topstepx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.config.secretStoreName }}
    kind: SecretStore
  target:
    name: appsettings-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        ConnectionStrings__Topstep: "Username={{ `{{ .topstepUsername }}` }};Password={{ `{{ .topstepPassword }}` }};Host={{ `{{ .topstepHost }}` }};Database={{ required "secrets.ConnectionStrings.Topstep.database is required" .Values.secrets.ConnectionStrings.Topstep.database }};Port={{ `{{ .topstepPort }}` }}{{- if .Values.secrets.ConnectionStrings.Topstep.includeErrorDetail }};Include Error Detail=true{{- end }}{{- with .Values.secrets.ConnectionStrings.Topstep.commandTimeout }};Command Timeout={{ . }}{{- end }}"
        ConnectionStrings__TopstepReadOnly: "Username={{ `{{ .topstepReadOnlyUsername }}` }};Password={{ `{{ .topstepReadOnlyPassword }}` }};Host={{ `{{ .topstepReadOnlyHost }}` }};Database={{ required "secrets.ConnectionStrings.TopstepReadOnly.database is required" .Values.secrets.ConnectionStrings.TopstepReadOnly.database }};Port={{ `{{ .topstepReadOnlyPort }}` }}{{- if .Values.secrets.ConnectionStrings.TopstepReadOnly.includeErrorDetail }};Include Error Detail=true{{- end }}{{- with .Values.secrets.ConnectionStrings.TopstepReadOnly.commandTimeout }};Command Timeout={{ . }}{{- end }}"
        ConnectionStrings__Chart: "Username={{ `{{ .chartUsername }}` }};Password={{ `{{ .chartPassword }}` }};Host={{ `{{ .chartHost }}` }};Database={{ required "secrets.ConnectionStrings.Chart.database is required" .Values.secrets.ConnectionStrings.Chart.database }};Port={{ `{{ .chartPort }}` }}{{- if .Values.secrets.ConnectionStrings.Chart.includeErrorDetail }};Include Error Detail=true{{- end }}{{- with .Values.secrets.ConnectionStrings.Chart.commandTimeout }};Command Timeout={{ . }}{{- end }}"
        Jwt__Secret: "{{ `{{ .jwtSecret }}` }}"
        Temporal__ApiKey: "{{ `{{ .temporalApiKey }}` }}"
        MarketDataApi__ApiKey: "{{ `{{ .marketDataApiKey }}` }}"
        Strapi__Token: "{{ `{{ .strapiToken }}` }}"
        Stripe__ApiKey: "{{ `{{ .stripeApiKey }}` }}"
        ElasticSearch__Password: "{{ `{{ .elasticSearchPassword }}` }}"
        ElasticSearch__CloudApiKey: "{{ `{{ .elasticSearchCloudApiKey }}` }}"
  data:
    - secretKey: topstepHost
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.Topstep.remoteKey is required" "value" .Values.secrets.ConnectionStrings.Topstep.remoteKey "context" $) | quote }}
        property: host
    - secretKey: topstepPort
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.Topstep.remoteKey is required" "value" .Values.secrets.ConnectionStrings.Topstep.remoteKey "context" $) | quote }}
        property: port
    - secretKey: topstepUsername
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.Topstep.remoteKey is required" "value" .Values.secrets.ConnectionStrings.Topstep.remoteKey "context" $) | quote }}
        property: username
    - secretKey: topstepPassword
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.Topstep.remoteKey is required" "value" .Values.secrets.ConnectionStrings.Topstep.remoteKey "context" $) | quote }}
        property: password
    - secretKey: topstepReadOnlyHost
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.TopstepReadOnly.remoteKey is required" "value" .Values.secrets.ConnectionStrings.TopstepReadOnly.remoteKey "context" $) | quote }}
        property: host
    - secretKey: topstepReadOnlyPort
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.TopstepReadOnly.remoteKey is required" "value" .Values.secrets.ConnectionStrings.TopstepReadOnly.remoteKey "context" $) | quote }}
        property: port
    - secretKey: topstepReadOnlyUsername
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.TopstepReadOnly.remoteKey is required" "value" .Values.secrets.ConnectionStrings.TopstepReadOnly.remoteKey "context" $) | quote }}
        property: username
    - secretKey: topstepReadOnlyPassword
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.TopstepReadOnly.remoteKey is required" "value" .Values.secrets.ConnectionStrings.TopstepReadOnly.remoteKey "context" $) | quote }}
        property: password
    - secretKey: chartHost
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.Chart.remoteKey is required" "value" .Values.secrets.ConnectionStrings.Chart.remoteKey "context" $) | quote }}
        property: host
    - secretKey: chartPort
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.Chart.remoteKey is required" "value" .Values.secrets.ConnectionStrings.Chart.remoteKey "context" $) | quote }}
        property: port
    - secretKey: chartUsername
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.Chart.remoteKey is required" "value" .Values.secrets.ConnectionStrings.Chart.remoteKey "context" $) | quote }}
        property: username
    - secretKey: chartPassword
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ConnectionStrings.Chart.remoteKey is required" "value" .Values.secrets.ConnectionStrings.Chart.remoteKey "context" $) | quote }}
        property: password
    - secretKey: jwtSecret
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.Jwt.remoteKey is required" "value" .Values.secrets.Jwt.remoteKey "context" $) | quote }}
        property: {{ default "secret" .Values.secrets.Jwt.Secret.property }}
    - secretKey: temporalApiKey
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.Temporal.remoteKey is required" "value" .Values.secrets.Temporal.remoteKey "context" $) | quote }}
        property: {{ default "apiKey" .Values.secrets.Temporal.ApiKey.property }}
    - secretKey: marketDataApiKey
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.MarketDataApi.remoteKey is required" "value" .Values.secrets.MarketDataApi.remoteKey "context" $) | quote }}
        property: {{ default "apiKey" .Values.secrets.MarketDataApi.ApiKey.property }}
    - secretKey: strapiToken
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.Strapi.remoteKey is required" "value" .Values.secrets.Strapi.remoteKey "context" $) | quote }}
        property: {{ default "token" .Values.secrets.Strapi.Token.property }}
    - secretKey: stripeApiKey
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.Stripe.remoteKey is required" "value" .Values.secrets.Stripe.remoteKey "context" $) | quote }}
        property: {{ default "apiKey" .Values.secrets.Stripe.ApiKey.property }}
    - secretKey: elasticSearchPassword
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ElasticSearch.remoteKey is required" "value" .Values.secrets.ElasticSearch.remoteKey "context" $) | quote }}
        property: {{ default "password" .Values.secrets.ElasticSearch.Password.property }}
    - secretKey: elasticSearchCloudApiKey
      remoteRef:
        key: {{ include "topstepx.renderValueTpl" (dict "message" "secrets.ElasticSearch.remoteKey is required" "value" .Values.secrets.ElasticSearch.remoteKey "context" $) | quote }}
        property: {{ default "cloudApiKey" .Values.secrets.ElasticSearch.CloudApiKey.property }}
