apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: appsettings-secrets
  labels:
    {{- include "topstepx.labels" . | nindent 4 }}
{{- $genericSecrets := omit .Values.secrets "refreshInterval" "store" "ConnectionStrings" }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.config.secretStoreName }}
    kind: SecretStore
  target:
    name: appsettings-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        appsettings.secrets.json: |-
          {
            "ConnectionStrings": {
              "Topstep": "Username={{ include "topstepx.esoVar" "topstepUsername" }};Password={{ include "topstepx.esoVar" "topstepPassword" }};Host={{ include "topstepx.esoVar" "topstepHost" }};Database={{ required "secrets.ConnectionStrings.Topstep.database is required" .Values.secrets.ConnectionStrings.Topstep.database }};Port={{ include "topstepx.esoVar" "topstepPort" }}{{- if .Values.secrets.ConnectionStrings.Topstep.includeErrorDetail }};Include Error Detail=true{{- end }}{{- with .Values.secrets.ConnectionStrings.Topstep.commandTimeout }};Command Timeout={{ . }}{{- end }}",
              "TopstepReadOnly": "Username={{ include "topstepx.esoVar" "topstepReadOnlyUsername" }};Password={{ include "topstepx.esoVar" "topstepReadOnlyPassword" }};Host={{ include "topstepx.esoVar" "topstepReadOnlyHost" }};Database={{ required "secrets.ConnectionStrings.TopstepReadOnly.database is required" .Values.secrets.ConnectionStrings.TopstepReadOnly.database }};Port={{ include "topstepx.esoVar" "topstepReadOnlyPort" }}{{- if .Values.secrets.ConnectionStrings.TopstepReadOnly.includeErrorDetail }};Include Error Detail=true{{- end }}{{- with .Values.secrets.ConnectionStrings.TopstepReadOnly.commandTimeout }};Command Timeout={{ . }}{{- end }}",
              "Chart": "Username={{ include "topstepx.esoVar" "chartUsername" }};Password={{ include "topstepx.esoVar" "chartPassword" }};Host={{ include "topstepx.esoVar" "chartHost" }};Database={{ required "secrets.ConnectionStrings.Chart.database is required" .Values.secrets.ConnectionStrings.Chart.database }};Port={{ include "topstepx.esoVar" "chartPort" }}{{- if .Values.secrets.ConnectionStrings.Chart.includeErrorDetail }};Include Error Detail=true{{- end }}{{- with .Values.secrets.ConnectionStrings.Chart.commandTimeout }};Command Timeout={{ . }}{{- end }}"
            }
{{- range $sectionName := keys $genericSecrets | sortAlpha }}
{{- $section := get $genericSecrets $sectionName }}
            ,
            "{{ $sectionName }}": {
{{ include "topstepx.renderSecretJsonMembers" (dict "node" $section "path" (list $sectionName)) | nindent 14 }}
            }
{{- end }}
          }
  data:
    - secretKey: topstepHost
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.Topstep.remoteKey is required" .Values.secrets.ConnectionStrings.Topstep.remoteKey | quote }}
        property: host
    - secretKey: topstepPort
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.Topstep.remoteKey is required" .Values.secrets.ConnectionStrings.Topstep.remoteKey | quote }}
        property: port
    - secretKey: topstepUsername
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.Topstep.remoteKey is required" .Values.secrets.ConnectionStrings.Topstep.remoteKey | quote }}
        property: username
    - secretKey: topstepPassword
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.Topstep.remoteKey is required" .Values.secrets.ConnectionStrings.Topstep.remoteKey | quote }}
        property: password
    - secretKey: topstepReadOnlyHost
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.TopstepReadOnly.remoteKey is required" .Values.secrets.ConnectionStrings.TopstepReadOnly.remoteKey | quote }}
        property: host
    - secretKey: topstepReadOnlyPort
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.TopstepReadOnly.remoteKey is required" .Values.secrets.ConnectionStrings.TopstepReadOnly.remoteKey | quote }}
        property: port
    - secretKey: topstepReadOnlyUsername
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.TopstepReadOnly.remoteKey is required" .Values.secrets.ConnectionStrings.TopstepReadOnly.remoteKey | quote }}
        property: username
    - secretKey: topstepReadOnlyPassword
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.TopstepReadOnly.remoteKey is required" .Values.secrets.ConnectionStrings.TopstepReadOnly.remoteKey | quote }}
        property: password
    - secretKey: chartHost
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.Chart.remoteKey is required" .Values.secrets.ConnectionStrings.Chart.remoteKey | quote }}
        property: host
    - secretKey: chartPort
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.Chart.remoteKey is required" .Values.secrets.ConnectionStrings.Chart.remoteKey | quote }}
        property: port
    - secretKey: chartUsername
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.Chart.remoteKey is required" .Values.secrets.ConnectionStrings.Chart.remoteKey | quote }}
        property: username
    - secretKey: chartPassword
      remoteRef:
        key: {{ required "secrets.ConnectionStrings.Chart.remoteKey is required" .Values.secrets.ConnectionStrings.Chart.remoteKey | quote }}
        property: password
{{- range $sectionName := keys $genericSecrets | sortAlpha }}
{{- $section := get $genericSecrets $sectionName }}
{{ include "topstepx.renderSecretDataEntries" (dict "node" $section "path" (list $sectionName) "remoteKey" $section.remoteKey) }}
{{- end }}
