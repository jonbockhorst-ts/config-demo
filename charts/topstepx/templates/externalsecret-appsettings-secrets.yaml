apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: appsettings-secrets
  labels:
    {{- include "topstepx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.config.secretStoreName }}
    kind: SecretStore
  target:
    name: appsettings-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        appsettings.secrets.json: |-
          {
            "ConnectionStrings": {
              "Topstep": "{{ include "topstepx.renderPostgresConnectionString" (dict "secretPrefix" "topstep" "binding" .Values.secrets.bindings.ConnectionStrings.Topstep "database" (required "secrets.bindings.ConnectionStrings.Topstep.database is required" .Values.secrets.bindings.ConnectionStrings.Topstep.database)) }}",
              "TopstepReadOnly": "{{ include "topstepx.renderPostgresConnectionString" (dict "secretPrefix" "topstepReadOnly" "binding" .Values.secrets.bindings.ConnectionStrings.TopstepReadOnly "database" (required "secrets.bindings.ConnectionStrings.TopstepReadOnly.database is required" .Values.secrets.bindings.ConnectionStrings.TopstepReadOnly.database)) }}",
              "Chart": "{{ include "topstepx.renderPostgresConnectionString" (dict "secretPrefix" "chart" "binding" .Values.secrets.bindings.ConnectionStrings.Chart "database" (required "secrets.bindings.ConnectionStrings.Chart.database is required" .Values.secrets.bindings.ConnectionStrings.Chart.database)) }}"
            },
            "Jwt": {
              "Secret": "{{ `{{ .jwtSecret }}` }}"
            },
            "Temporal": {
              "ApiKey": "{{ `{{ .temporalApiKey }}` }}"
            },
            "MarketDataApi": {
              "ApiKey": "{{ `{{ .marketDataApiKey }}` }}"
            },
            "Strapi": {
              "Token": "{{ `{{ .strapiToken }}` }}"
            }
          }
  data:
    - secretKey: topstepHost
      remoteRef:
        key: {{ required "secrets.sources.topstep.remoteKey is required" .Values.secrets.sources.topstep.remoteKey | quote }}
        property: host
    - secretKey: topstepPort
      remoteRef:
        key: {{ required "secrets.sources.topstep.remoteKey is required" .Values.secrets.sources.topstep.remoteKey | quote }}
        property: port
    - secretKey: topstepUsername
      remoteRef:
        key: {{ required "secrets.sources.topstep.remoteKey is required" .Values.secrets.sources.topstep.remoteKey | quote }}
        property: username
    - secretKey: topstepPassword
      remoteRef:
        key: {{ required "secrets.sources.topstep.remoteKey is required" .Values.secrets.sources.topstep.remoteKey | quote }}
        property: password
    - secretKey: topstepReadOnlyHost
      remoteRef:
        key: {{ required "secrets.sources.topstepReadOnly.remoteKey is required" .Values.secrets.sources.topstepReadOnly.remoteKey | quote }}
        property: host
    - secretKey: topstepReadOnlyPort
      remoteRef:
        key: {{ required "secrets.sources.topstepReadOnly.remoteKey is required" .Values.secrets.sources.topstepReadOnly.remoteKey | quote }}
        property: port
    - secretKey: topstepReadOnlyUsername
      remoteRef:
        key: {{ required "secrets.sources.topstepReadOnly.remoteKey is required" .Values.secrets.sources.topstepReadOnly.remoteKey | quote }}
        property: username
    - secretKey: topstepReadOnlyPassword
      remoteRef:
        key: {{ required "secrets.sources.topstepReadOnly.remoteKey is required" .Values.secrets.sources.topstepReadOnly.remoteKey | quote }}
        property: password
    - secretKey: chartHost
      remoteRef:
        key: {{ required "secrets.sources.chart.remoteKey is required" .Values.secrets.sources.chart.remoteKey | quote }}
        property: host
    - secretKey: chartPort
      remoteRef:
        key: {{ required "secrets.sources.chart.remoteKey is required" .Values.secrets.sources.chart.remoteKey | quote }}
        property: port
    - secretKey: chartUsername
      remoteRef:
        key: {{ required "secrets.sources.chart.remoteKey is required" .Values.secrets.sources.chart.remoteKey | quote }}
        property: username
    - secretKey: chartPassword
      remoteRef:
        key: {{ required "secrets.sources.chart.remoteKey is required" .Values.secrets.sources.chart.remoteKey | quote }}
        property: password
    - secretKey: jwtSecret
      remoteRef:
        key: {{ required "secrets.sources.jwt.remoteKey is required" .Values.secrets.sources.jwt.remoteKey | quote }}
        property: {{ default "secret" .Values.secrets.bindings.Jwt.Secret.property }}
    - secretKey: temporalApiKey
      remoteRef:
        key: {{ required "secrets.sources.temporal.remoteKey is required" .Values.secrets.sources.temporal.remoteKey | quote }}
        property: {{ default "apiKey" .Values.secrets.bindings.Temporal.ApiKey.property }}
    - secretKey: marketDataApiKey
      remoteRef:
        key: {{ required "secrets.sources.marketDataApi.remoteKey is required" .Values.secrets.sources.marketDataApi.remoteKey | quote }}
        property: {{ default "apiKey" .Values.secrets.bindings.MarketDataApi.ApiKey.property }}
    - secretKey: strapiToken
      remoteRef:
        key: {{ required "secrets.sources.strapi.remoteKey is required" .Values.secrets.sources.strapi.remoteKey | quote }}
        property: {{ default "token" .Values.secrets.bindings.Strapi.Token.property }}
