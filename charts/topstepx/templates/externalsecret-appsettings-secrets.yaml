apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: appsettings-secrets
  labels:
    {{- include "topstepx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.config.secretStoreName }}
    kind: SecretStore
  target:
    name: appsettings-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        appsettings.secrets.json: |-
{{ .Values.secrets.template | toPrettyJson | nindent 10 }}
  data:
{{- range $varName := keys .Values.secrets.vars | sortAlpha }}
{{- $var := get $.Values.secrets.vars $varName }}
    - secretKey: {{ $varName }}
      remoteRef:
        key: {{ required (printf "secrets.vars.%s.remoteKey is required" $varName) $var.remoteKey | quote }}
        property: {{ default $varName $var.property }}
{{- end }}
