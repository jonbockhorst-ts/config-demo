nameOverride: demo-app

config:
  secretStoreName: kubernetes-seed
  secretsEnv: demo
  useConfigMap: true

image:
  repository: eso-config-demo
  tag: local
  pullPolicy: Never

service:
  port: 80
  targetPort: 8080

appsettings:
  Logging:
    LogLevel:
      Default: Information
  FeatureFlags:
    AllowAnonymousRegistration: false
    EnableHubspotEmails: true
    ClearAllSessionsOnSsoLogin: false
  Demo:
    EnvironmentName: shared-dev-default
    SecretSource: eso-kubernetes-provider
  ConnectionStrings:
    Topstep:
      IncludeErrorDetail: true
    TopstepReadOnly:
      IncludeErrorDetail: true
    Chart:
      CommandTimeout: 900
  Strapi:
    BaseUrl: https://strapi-cms.topstep.com/api/
  MarketDataApi:
    BaseUrl: http://webapi.marketdata.svc.cluster.local
    EventHubUrl: http://webapi.marketdata.svc.cluster.local/hubs/event
    BackAdjustHistoricalBars: true
  ElasticSearch:
    Url: https://elastic.local/
    Username: elastic
    CloudId: topstepx-demo:ZXMtdXM...==
  Temporal:
    Address: topstepx-dev.tmprl.cloud:7233
    Namespace: topstepx-dev
    TaskQueues:
      - topstepx-temporal-worker-queue

secrets:
  refreshInterval: 5m
  store:
    remoteNamespace: eso-seed
    tokenSecretName: eso-kubernetes-store-token
    tokenSecretKey: token
  ConnectionStrings:
    Topstep:
      remoteKey: /databases/postgres/{{ .Values.config.secretsEnv }}
      database: dev
    TopstepReadOnly:
      remoteKey: /databases/postgres/{{ .Values.config.secretsEnv }}/readonly
      database: dev
    Chart:
      remoteKey: /databases/chart/{{ .Values.config.secretsEnv }}
      database: cqg-contract-bars
  Jwt:
    remoteKey: /auth/jwt/{{ .Values.config.secretsEnv }}
    Secret: { property: secret }
  Temporal:
    remoteKey: /temporal/{{ .Values.config.secretsEnv }}
    ApiKey: { property: apiKey }
  MarketDataApi:
    remoteKey: /apis/marketdata/{{ .Values.config.secretsEnv }}
    ApiKey: { property: apiKey }
  Strapi:
    remoteKey: /apis/strapi/{{ .Values.config.secretsEnv }}
    Token: { property: token }
  Stripe:
    remoteKey: /apis/stripe/{{ .Values.config.secretsEnv }}
    ApiKey: { property: apiKey }
  ElasticSearch:
    remoteKey: /elasticsearch/{{ .Values.config.secretsEnv }}
    Password:
      property: password
    CloudApiKey:
      property: cloudApiKey
