topstepx:
  nameOverride: demo-app

  config:
    secretStoreName: kubernetes-seed

  image:
    repository: eso-config-demo
    tag: local
    pullPolicy: Never

  appsettings:
    Demo:
      EnvironmentName: demo
 
  secrets:
    refreshInterval: 1m
    store:
      remoteNamespace: eso-seed
      tokenSecretName: eso-kubernetes-store-token
      tokenSecretKey: token
    template:
      ConnectionStrings:
        Topstep: "Username={{ .topstepUsername }};Password={{ .topstepPassword }};Host={{ .topstepHost }};Database=demo;Port={{ .topstepPort }};Include Error Detail=true"
        TopstepReadOnly: "Username={{ .topstepReadOnlyUsername }};Password={{ .topstepReadOnlyPassword }};Host={{ .topstepReadOnlyHost }};Database=demo;Port={{ .topstepReadOnlyPort }};Include Error Detail=true"
        Chart: "Username={{ .chartUsername }};Password={{ .chartPassword }};Host={{ .chartHost }};Database=cqg-contract-bars-demo;Port={{ .chartPort }};Command Timeout=900"
    vars:
      topstepHost:
        remoteKey: databases-postgres-demo
      topstepPort:
        remoteKey: databases-postgres-demo
      topstepUsername:
        remoteKey: databases-postgres-demo
      topstepPassword:
        remoteKey: databases-postgres-demo
      topstepReadOnlyHost:
        remoteKey: databases-postgres-demo-readonly
      topstepReadOnlyPort:
        remoteKey: databases-postgres-demo-readonly
      topstepReadOnlyUsername:
        remoteKey: databases-postgres-demo-readonly
      topstepReadOnlyPassword:
        remoteKey: databases-postgres-demo-readonly
      chartHost:
        remoteKey: databases-chart-demo
      chartPort:
        remoteKey: databases-chart-demo
      chartUsername:
        remoteKey: databases-chart-demo
      chartPassword:
        remoteKey: databases-chart-demo
      jwtSecret:
        remoteKey: auth-jwt-demo
      temporalApiKey:
        remoteKey: temporal-demo
      marketDataApiKey:
        remoteKey: api-marketdata-demo
      strapiToken:
        remoteKey: api-strapi-demo
      stripeApiKey:
        remoteKey: api-stripe-demo
      elasticSearchPassword:
        remoteKey: elasticsearch-demo
      elasticSearchCloudApiKey:
        remoteKey: elasticsearch-demo
